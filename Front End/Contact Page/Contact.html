<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Blogging Website</title>
    <link rel="stylesheet" href="Contact.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">My Blog</div>
        <div class="nav-links">
            <a href="../Front.html">Home</a>
            <a href="../Create a blog/Create.html">Create a Blog</a>
            <a href="Contact.html" class="active">Contact</a>
            <a href="../Login Page/Login.html" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="contact-container">
        <div class="contact-box">
            <h1>Contact Me</h1>
            <p class="subtitle">Have any questions, feedback, or want to collaborate? Leave a message below!</p>

            <form id="contactForm" action="../Front.html" onsubmit="return formvalid()">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" placeholder="e.g. john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" placeholder="What is this about?" required>
                </div>

                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" rows="6" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn-send">Send Message</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 My Blog. All rights reserved.</p>
    </footer>

    <script src="Contact.js"></script>
</body>
</html>
